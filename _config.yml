# ==========================================
# CONFIGURAZIONE TEMA (Minimal Mistakes Remote)
# ==========================================
remote_theme            : "mmistakes/minimal-mistakes@master"
minimal_mistakes_skin   : "default" # Opzioni: "air", "aqua", "contrast", "dark", "neon", "mint", "plum", "sunrise"

# ==========================================
# IMPOSTAZIONI SITO
# ==========================================
title                   : "neulas"
description             : "Una persona non esperta, un'AI al fianco, un problema alla volta. Un blog con racconti su progetti realizzati sperimentando l'affiancamento di una o più AI."
# url                   : "https://neulas.it" # Rimuovi il # quando collegherai il dominio definitivo
baseurl                 : "/neulas"           # Lascia così se l'indirizzo attuale è utente.github.io/neulas
locale                  : "it-IT"

# ==========================================
# NAVIGAZIONE (Attiva il menu superiore)
# ==========================================
site_navigation         : main

# ==========================================
# BIOGRAFIA / AUTORE (Mostrata nella barra laterale)
# ==========================================
author:
  name                  : "Roberto"
  bio                   : "Racconti onesti di progetti realizzati al fianco dell'Intelligenza Artificiale."
  avatar                : "/assets/images/avatar.jpg" # Puoi aggiungere una tua foto in questa cartella
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com" # Inserisci il tuo link effettivo

# ==========================================
# PLUGIN E COMPILAZIONE
# ==========================================
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock

# ==========================================
# IMPOSTAZIONI DI DEFAULT PER PAGINE E POST
# ==========================================
defaults:
  # Impostazioni per tutti i Post del blog
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true # Mostra la biografia a sinistra dell'articolo
      read_time: true      # Mostra il tempo di lettura stimato
      comments: false
  # Impostazioni per le Pagine statiche (es. about.md)
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
